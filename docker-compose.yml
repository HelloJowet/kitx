services:
  mysql:
    image: mysql:latest
    container_name: kitx-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: kitxtest
    ports:
      - 10000:3306

  postgres:
    image: postgres:latest
    container_name: kitx-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kitxtest
    ports:
      - 10001:5432
